name: Patch career resume reconstruction

on:
  push:
    branches: [agent/extreme-save-resume]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/extreme-save-resume
      - name: Apply exact resume-state patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/example/GameViewModel.kt')
          text = path.read_text()
          old = '''            val loadedGameState = when {
                loadedSeason.currentDay < 82 -> GameState.ACTIVE
                loadedPlayoffResult != null -> GameState.CHAMPIONSHIP_CELEBRATION
                else -> GameState.PLAYOFFS
            }'''
          new = '''            val loadedGameState = com.example.domain.season.CareerResumeRules.resolve(
                currentDay = loadedSeason.currentDay,
                hasPlayoffResult = loadedPlayoffResult != null,
                hasDraftClass = loadedDraftRookies.isNotEmpty()
            )'''
          if old not in text:
              raise SystemExit('Expected resume-state block not found; refusing blind patch')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/patch-career-resume.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/GameViewModel.kt .github/workflows/patch-career-resume.yml
          git commit -m 'Resume persisted draft phase correctly'
          git push origin HEAD:agent/extreme-save-resume
