name: Patch career resume reconstruction

on:
  push:
    branches: [agent/extreme-save-resume]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/extreme-save-resume
      - name: Apply uniquely matched resume-state patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('app/src/main/java/com/example/GameViewModel.kt')
          text = path.read_text()
          pattern = re.compile(
              r'(?m)^(?P<i>[ \t]*)val loadedGameState = when \{\s*\n'
              r'[ \t]*loadedSeason\.currentDay < 82 -> GameState\.ACTIVE\s*\n'
              r'[ \t]*loadedPlayoffResult != null -> GameState\.CHAMPIONSHIP_CELEBRATION\s*\n'
              r'[ \t]*else -> GameState\.PLAYOFFS\s*\n'
              r'[ \t]*\}'
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one resume-state block, found {len(matches)}')
          indent = matches[0].group('i')
          replacement = (
              f'{indent}val loadedGameState = com.example.domain.season.CareerResumeRules.resolve(\n'
              f'{indent}    currentDay = loadedSeason.currentDay,\n'
              f'{indent}    hasPlayoffResult = loadedPlayoffResult != null,\n'
              f'{indent}    hasDraftClass = loadedDraftRookies.isNotEmpty()\n'
              f'{indent})'
          )
          path.write_text(pattern.sub(replacement, text, count=1))
          PY
          rm .github/workflows/patch-career-resume.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/GameViewModel.kt .github/workflows/patch-career-resume.yml
          git commit -m 'Resume persisted draft phase correctly'
          git push origin HEAD:agent/extreme-save-resume
