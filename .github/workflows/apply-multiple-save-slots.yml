name: Apply multiple save slots

on:
  push:
    branches:
      - feature/multiple-save-slots
    paths:
      - .github/workflows/apply-multiple-save-slots.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multiple-save-slots
          fetch-depth: 0

      - name: Apply multi-save architecture
        run: python3 .github/scripts/apply_multi_save.py

      - name: Commit implementation and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-multiple-save-slots.yml .github/scripts/apply_multi_save.py
          git add app/src/main/java app/src/androidTest/java
          git commit -m "Add isolated multiple career save slots"
          git push origin HEAD:feature/multiple-save-slots
