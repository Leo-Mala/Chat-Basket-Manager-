        newsFeedJson = null,
        latestBoxScoreJson = null,
        playoffResultJson = null,
        difficulty = difficulty,
        injuriesEnabled = true,
        autoSubstitutionsEnabled = true,
        updatedAt = System.currentTimeMillis()
    )
}
''')

