name: Apply Economy Runtime Patch

on:
  push:
    branches: [test/economy-sports-balance]
    paths:
      - '.github/workflows/apply-economy-runtime-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/economy-sports-balance
      - name: Apply verified runtime patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/GameViewModel.kt')
          s = p.read_text()

          def once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          once(
              'import com.example.domain.contract.ContractOffer\n',
              'import com.example.domain.contract.ContractOffer\nimport com.example.domain.rules.ContractRules\n',
              'ContractRules import'
          )

          once(
              'val result = tradeManager.execute(currentSeason, team, myPlayer, offeredPlayer, contracts[myPlayer.id]) ?: return',
              'val result = tradeManager.execute(\n            currentSeason, team, myPlayer, offeredPlayer,\n            contracts[myPlayer.id], contracts[offeredPlayer.id]\n        ) ?: return',
              'trade contracts'
          )

          finance_old = '''                    day = currentSeason.currentDay,\n                    ticketPriceOverride = financeAdvanced.ticketPrice\n                )'''
          finance_new = '''                    day = currentSeason.currentDay,\n                    ticketPriceOverride = financeAdvanced.ticketPrice,\n                    annualPlayerPayroll = currentManaged.players.sumOf { player ->\n                        contracts[player.id]?.salary ?: player.calculateSalary().toLong()\n                    }\n                )'''
          count = s.count(finance_old)
          if count != 2:
              raise SystemExit(f'finance calls: expected 2 matches, found {count}')
          s = s.replace(finance_old, finance_new)

          once(
              '            val cost = selectedPlayer.overall * 120000\n            ToastUtils.showToast(context, "Orçamento insuficiente! Custo: $${cost / 1000000.0}M", Toast.LENGTH_LONG)',
              '            val cost = ContractRules.signingBonus(selectedPlayer)\n            ToastUtils.showToast(context, "Contratação indisponível. Bônus de assinatura necessário: $${cost / 1000000.0}M", Toast.LENGTH_LONG)',
              'free-agent failure message'
          )

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/GameViewModel.kt
          git diff --cached --check
          git commit -m "Apply contract-aware runtime economy rules"
          git push origin HEAD:test/economy-sports-balance
