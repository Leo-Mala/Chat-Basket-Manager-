name: Patch autosave ordering hardening

on:
  push:
    branches:
      - 'audit/autosave-ordering'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/autosave-ordering
      - name: Apply autosave coordination patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vm = Path('app/src/main/java/com/example/GameViewModel.kt')
          text = vm.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import com.example.utils.CoachFeedbackGenerator\nimport com.example.utils.ToastUtils',
              'import com.example.utils.CoachFeedbackGenerator\nimport com.example.utils.SaveRequestCoordinator\nimport com.example.utils.ToastUtils',
              'SaveRequestCoordinator import'
          )
          replace_once('import java.util.concurrent.atomic.AtomicLong\n', '', 'AtomicLong import')
          replace_once(
              '    /** Serializes snapshot writes and invalidates stale saves after a career reset. */\n'
              '    private val saveMutex = Mutex()\n'
              '    private val saveGeneration = AtomicLong(0L)',
              '    /** Serializes persistence and coalesces stale snapshots/reset races. */\n'
              '    private val saveMutex = Mutex()\n'
              '    private val saveCoordinator = SaveRequestCoordinator()',
              'save coordinator fields'
          )
          replace_once(
              '        // Invalidate every snapshot captured before this reset. The reset itself is\n'
              '        // serialized by AutoSaveManager, so an older save can never overwrite the new career.\n'
              '        val generation = saveGeneration.incrementAndGet()\n'
              '        viewModelScope.launch(Dispatchers.IO) {\n'
              '            AutoSaveManager.clearGameState()\n'
              '            if (generation != saveGeneration.get()) return@launch\n'
              '            withContext(Dispatchers.Main) {\n'
              '                initializeNewGame(selectedTeamName, coachName, offSkill, defSkill, motSkill, selectedDifficulty)\n'
              '            }\n'
              '        }',
              '        // Invalidate queued snapshots before clearing. Clear shares the same mutex as saves,\n'
              '        // so an in-flight old snapshot must finish before the database is cleared.\n'
              '        val resetToken = saveCoordinator.beginReset()\n'
              '        viewModelScope.launch(Dispatchers.IO) {\n'
              '            saveMutex.withLock { AutoSaveManager.clearGameState() }\n'
              '            if (!saveCoordinator.isCurrentReset(resetToken)) return@launch\n'
              '            withContext(Dispatchers.Main) {\n'
              '                if (!saveCoordinator.finishReset(resetToken)) return@withContext\n'
              '                initializeNewGame(selectedTeamName, coachName, offSkill, defSkill, motSkill, selectedDifficulty)\n'
              '            }\n'
              '        }',
              'startNewGame reset ordering'
          )
          replace_once(
              '    fun saveGame() {\n        val generation = saveGeneration.get()',
              '    fun saveGame() {\n        val saveTicket = saveCoordinator.nextSave() ?: return',
              'save ticket creation'
          )
          replace_once(
              '                // A newer state has already been scheduled; skip this stale snapshot.\n'
              '                if (generation != saveGeneration.get()) return@withLock',
              '                // Only the newest snapshot in the current career may reach Room.\n'
              '                if (!saveCoordinator.isCurrent(saveTicket)) return@withLock',
              'stale save guard'
          )
          replace_once(
              '    fun clearSavedGame(context: Context) {\n'
              '        val generation = saveGeneration.incrementAndGet()\n'
              '        viewModelScope.launch {\n'
              '            withContext(Dispatchers.IO) { AutoSaveManager.clearGameState() }\n'
              '            if (generation != saveGeneration.get()) return@launch\n'
              '            resetCareerState()\n'
              '            ToastUtils.showToast(context, "Jogo limpo!")\n'
              '        }\n'
              '    }',
              '    fun clearSavedGame(context: Context) {\n'
              '        val resetToken = saveCoordinator.beginReset()\n'
              '        viewModelScope.launch {\n'
              '            withContext(Dispatchers.IO) {\n'
              '                saveMutex.withLock { AutoSaveManager.clearGameState() }\n'
              '            }\n'
              '            if (!saveCoordinator.isCurrentReset(resetToken)) return@launch\n'
              '            if (!saveCoordinator.finishReset(resetToken)) return@launch\n'
              '            resetCareerState()\n'
              '            ToastUtils.showToast(context, "Jogo limpo!")\n'
              '        }\n'
              '    }',
              'clearSavedGame reset ordering'
          )
          vm.write_text(text)
          PY

          mkdir -p app/src/main/java/com/example/utils
          echo '' | base64 -d > app/src/main/java/com/example/utils/SaveRequestCoordinator.kt
          echo '' | base64 -d > app/src/test/java/com/example/SaveGenerationTest.kt

          rm .github/workflows/patch-autosave-ordering.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Harden autosave ordering across resets'
          git push origin HEAD:audit/autosave-ordering
