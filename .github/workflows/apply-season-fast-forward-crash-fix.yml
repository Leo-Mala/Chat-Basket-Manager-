name: Apply season fast-forward crash fix

on:
  push:
    branches:
      - fix/season-fast-forward-crash

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/season-fast-forward-crash

      - name: Apply patch
        run: python3 .github/scripts/apply_season_fast_forward_fix.py

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-season-fast-forward-crash-fix.yml
          git rm .github/scripts/apply_season_fast_forward_fix.py
          git add app/src/main/java/com/example/GameViewModel.kt
          git add app/src/main/java/com/example/simulator/GameSimulator.kt
          git add app/src/main/java/com/example/ui/DashboardTab.kt
          git add app/src/test/java/com/example/RealSeasonSimulationTest.kt
          git diff --cached --check
          git commit -m "Fix season fast-forward runtime crash"
          git push origin HEAD:fix/season-fast-forward-crash
