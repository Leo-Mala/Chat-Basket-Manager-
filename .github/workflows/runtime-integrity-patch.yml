name: Runtime Integrity Patch

on:
  push:
    branches:
      - fix/runtime-career-integrity
    paths:
      - scripts/runtime_integrity_patch.py
      - .github/workflows/runtime-integrity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-career-integrity
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply verified patch
        run: python scripts/runtime_integrity_patch.py
      - name: Generate current Room schema
        run: ./gradlew --no-daemon :app:kspDebugKotlin
      - name: Commit patched sources and schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java app/schemas
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
          else
            git commit -m "Fix runtime career integrity"
            git push origin HEAD:fix/runtime-career-integrity
          fi
