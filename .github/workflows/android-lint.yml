name: Android Lint

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Bootstrap Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon wrapper --gradle-version 9.3.1 --distribution-type bin
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Run lint
        run: ./gradlew --no-daemon lint --stacktrace
