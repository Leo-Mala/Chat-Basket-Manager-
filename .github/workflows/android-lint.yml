name: Android Lint

on:
  push:
    branches:
      - main
      - master
      - fix/android-build-validation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -s gradlew
          test -s gradlew.bat
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          grep -q 'gradle-9.3.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Run lint
        run: ./gradlew --no-daemon lint --stacktrace
