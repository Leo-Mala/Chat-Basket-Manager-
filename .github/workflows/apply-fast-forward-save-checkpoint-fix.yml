name: Apply fast-forward save checkpoint fix

on:
  push:
    branches:
      - fix/season-fast-forward-crash

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/season-fast-forward-crash

      - name: Apply checkpoint patch
        run: python3 .github/scripts/apply_fast_forward_checkpoint_fix.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-fast-forward-save-checkpoint-fix.yml
          git rm .github/scripts/apply_fast_forward_checkpoint_fix.py
          git add app/src/main/java/com/example/GameViewModel.kt app/src/androidTest/java/com/example/FastForwardCheckpointPersistenceTest.kt
          git commit -m "Serialize fast-forward save checkpoints safely"
          git push origin HEAD:fix/season-fast-forward-crash
