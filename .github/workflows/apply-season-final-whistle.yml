name: Apply season final whistle

on:
  push:
    branches:
      - feature/season-complete-whistle

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/season-complete-whistle
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch completion whistle points
        run: python .github/scripts/apply-season-final-whistle.py
      - name: Remove temporary patch files and commit
        run: |
          rm .github/workflows/apply-season-final-whistle.yml
          rm .github/scripts/apply-season-final-whistle.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/GameViewModel.kt .github/workflows/apply-season-final-whistle.yml .github/scripts/apply-season-final-whistle.py
          git commit -m "Play completion whistle after NBA Finals"
          git push origin HEAD:feature/season-complete-whistle
