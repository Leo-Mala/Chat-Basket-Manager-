name: Harden multiple save slots

on:
  push:
    branches:
      - feature/multiple-save-slots
    paths:
      - .github/workflows/harden-multiple-save-slots.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multiple-save-slots
          fetch-depth: 0

      - name: Harden multi-save flow
        run: python3 .github/scripts/harden_multi_save.py

      - name: Commit hardening and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harden-multiple-save-slots.yml .github/scripts/harden_multi_save.py
          git add app/src/main/java
          git commit -m "Harden career slot switching and recovery"
          git push origin HEAD:feature/multiple-save-slots
