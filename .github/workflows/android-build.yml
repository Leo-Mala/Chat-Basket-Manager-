name: Android Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare deterministic test debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode .github/test-signing/basket-manager-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          expected='DB:3E:34:FD:17:33:87:29:B4:C7:58:87:57:C0:AC:93:D7:13:35:C4:56:7B:DA:21:17:A8:21:4F:D5:68:CF:74'
          actual="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          test "$actual" = "$expected"
          echo "Debug signing SHA256: $actual"

          echo "CI_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "CI_DEBUG_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "CI_DEBUG_STORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "CI_DEBUG_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -s gradlew
          test -s gradlew.bat
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          grep -q 'gradle-9.3.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Prepare release signing
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/basket-manager"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/basket-manager/release-upload.jks"
          chmod 600 "$RUNNER_TEMP/basket-manager/release-upload.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/basket-manager/release-upload.jks" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew --no-daemon test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify debug APK signer
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          expected='DB3E34FD17338729B4C7588757C0AC93D71335C4567BDA2117A8214FD568CF74'
          certs="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")"
          echo "$certs"
          actual="$(printf '%s\n' "$certs" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr '[:lower:]' '[:upper:]' \
            | tr -d ':')"
          test -n "$actual"
          test "$actual" = "$expected"
          echo "Verified debug APK signer SHA256: $actual"

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Build release AAB
        run: ./gradlew bundleRelease

      - name: Enable KVM group permissions
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Run Android instrumented tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace

      - name: Verify Android build outputs
        shell: bash
        run: |
          set -euo pipefail
          debug_apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -size +0c -print -quit)"
          release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -size +0c -print -quit)"
          release_aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -size +0c -print -quit)"
          test -n "$debug_apk"
          test -n "$release_apk"
          test -n "$release_aab"
          stat -c '%n %s bytes' "$debug_apk" "$release_apk" "$release_aab"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: basket-manager-release-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: basket-manager-test-reports
          path: |
            **/build/test-results/**
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
