name: Android Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle 9.3.1 bootstrap
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-cleanup: on-success

      - name: Bootstrap Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon wrapper --gradle-version 9.3.1 --distribution-type bin
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Verify Android build environment
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed

      - name: Prepare release signing
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/basket-manager"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/basket-manager/release-upload.jks"
          chmod 600 "$RUNNER_TEMP/basket-manager/release-upload.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/basket-manager/release-upload.jks" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew --no-daemon test --stacktrace

      - name: Run debug lint
        run: ./gradlew --no-daemon lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Build release APK and AAB
        run: ./gradlew --no-daemon assembleRelease bundleRelease --stacktrace

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          debug_apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          release_aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$debug_apk" && test -s "$debug_apk"
          test -n "$release_apk" && test -s "$release_apk"
          test -n "$release_aab" && test -s "$release_aab"
          echo "Debug APK: $debug_apk"
          echo "Release APK: $release_apk"
          echo "Release AAB: $release_aab"

      - name: Run Android instrumented tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace

      - name: Upload release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: basket-manager-release-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: basket-manager-test-reports
          path: |
            **/build/test-results/**
            **/build/reports/**
          if-no-files-found: ignore
