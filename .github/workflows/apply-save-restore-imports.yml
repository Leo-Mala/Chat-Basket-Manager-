name: Apply save restore imports
on:
  push:
    branches: [fix/live-match-finalization]
    paths:
      - '.github/scripts/fix_save_restore_imports.py'
      - '.github/workflows/apply-save-restore-imports.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/live-match-finalization
      - name: Apply imports
        run: python3 .github/scripts/fix_save_restore_imports.py
      - name: Verify imports
        run: |
          grep -q 'import com.example.domain.rules.SavedGameLoadState' app/src/main/java/com/example/GameViewModel.kt
          grep -q 'import com.example.domain.rules.SavedGameStartupRules' app/src/main/java/com/example/GameViewModel.kt
          grep -q 'import com.example.domain.rules.SavedGameLoadState' app/src/main/java/com/example/ui/GameApp.kt
      - name: Commit fix
        run: |
          rm .github/scripts/fix_save_restore_imports.py .github/workflows/apply-save-restore-imports.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix save restore startup imports'
          git push origin HEAD:fix/live-match-finalization
