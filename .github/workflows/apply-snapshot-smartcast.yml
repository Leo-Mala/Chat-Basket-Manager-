name: Apply snapshot smart-cast fix
on:
  push:
    branches: [fix/live-match-finalization]
    paths:
      - '.github/scripts/fix_snapshot_smartcast.py'
      - '.github/workflows/apply-snapshot-smartcast.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/live-match-finalization
      - name: Apply snapshot fix
        run: python3 .github/scripts/fix_snapshot_smartcast.py
      - name: Verify fix
        run: grep -q 'snapshot ?: return' app/src/main/java/com/example/GameViewModel.kt
      - name: Commit fix
        run: |
          rm .github/scripts/fix_snapshot_smartcast.py .github/workflows/apply-snapshot-smartcast.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix saved snapshot nullability check'
          git push origin HEAD:fix/live-match-finalization
