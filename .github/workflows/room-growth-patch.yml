name: Room growth patch

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/room-performance-growth
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/room_growth_patch.py
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/room-growth-patch.yml scripts/room_growth_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bound Room growth to active season detail'
          git push origin HEAD:audit/room-performance-growth
