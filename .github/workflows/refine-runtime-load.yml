name: Refine Runtime Load

on:
  push:
    branches:
      - fix/runtime-career-integrity
    paths:
      - scripts/refine_runtime_load.py
      - .github/workflows/refine-runtime-load.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-career-integrity
      - name: Apply verified refinement
        run: python scripts/refine_runtime_load.py
      - name: Commit refined source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/GameViewModel.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refine save loading and playoff resume flow"
            git push origin HEAD:fix/runtime-career-integrity
          fi
