name: Bootstrap Gradle Wrapper Once

on:
  push:
    branches:
      - fix/android-build-validation

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Generate and version Gradle Wrapper 9.3.1
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ] && [ -f gradlew.bat ] && [ -s gradle/wrapper/gradle-wrapper.jar ] && [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Wrapper already present; nothing to bootstrap."
            exit 0
          fi
          gradle --no-daemon wrapper --gradle-version 9.3.1 --distribution-type bin
          test -s gradlew
          test -s gradlew.bat
          test -s gradle/wrapper/gradle-wrapper.jar
          grep -q 'gradle-9.3.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m 'Bootstrap Gradle wrapper 9.3.1'
          git push origin HEAD:fix/android-build-validation
