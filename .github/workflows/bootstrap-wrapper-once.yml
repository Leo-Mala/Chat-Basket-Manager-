name: Apply Audited Source Fixes Once

on:
  push:
    branches:
      - fix/android-build-validation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply audited source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; import base64; p=Path('app/src/main/java/com/example/GameViewModel.kt'); s=p.read_text(); old=base64.b64decode('').decode(); assert s.count(old)==1, s.count(old); s=s.replace(old,'',1); assert s.count('fun simulationConfig(): SimulationConfig')==1; p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('app/src/main/java/com/example/data/repository/GameStateRepository.kt'); s=p.read_text(); old='db.playerDao().deleteAll()'; assert s.count(old)==1, s.count(old); s=s.replace(old,'db.playerDao().clear()',1); p.write_text(s)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/GameViewModel.kt app/src/main/java/com/example/data/repository/GameStateRepository.kt
          git diff --cached --check
          git commit -m 'Fix current Kotlin compiler errors'
          git push origin HEAD:fix/android-build-validation
