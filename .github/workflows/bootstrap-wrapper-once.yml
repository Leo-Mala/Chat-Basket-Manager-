name: Apply Audited Android Build Fixes Once

on:
  push:
    branches:
      - fix/android-build-validation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply audited fixes and final workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          vm = Path('app/src/main/java/com/example/GameViewModel.kt')
          text = vm.read_text()
          duplicate = '''    private fun simulationConfig(): com.example.simulator.SimulationConfig =
              com.example.simulator.SimulationConfig(
                  difficulty = difficulty,
                  injuriesEnabled = injuriesEnabled,
                  coach = coach,
                  tactics = tactics ?: Tactics(),
                  managedTeam = managedTeam,
                  finance = finances ?: Finance()
              )

'''
          if text.count(duplicate) != 1:
              raise SystemExit(f'Expected exactly one private duplicate simulationConfig block, found {text.count(duplicate)}')
          text = text.replace(duplicate, '', 1)
          if text.count('fun simulationConfig(): SimulationConfig') != 1:
              raise SystemExit('simulationConfig invariant failed after duplicate removal')
          vm.write_text(text)

          repo = Path('app/src/main/java/com/example/data/repository/GameStateRepository.kt')
          text = repo.read_text()
          old = 'db.playerDao().deleteAll()'
          new = 'db.playerDao().clear()'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one PlayerDao.deleteAll call, found {text.count(old)}')
          text = text.replace(old, new, 1)
          repo.write_text(text)

          build_workflow = '''name: Android Build & Test

          on:
            push:
              branches:
                - main
                - master
                - fix/android-build-validation
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            test-and-build:
              runs-on: ubuntu-latest
              timeout-minutes: 60
              steps:
                - name: Check out repository
                  uses: actions/checkout@v6

                - name: Set up JDK 17
                  uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: '17'

                - name: Set up Android SDK
                  uses: android-actions/setup-android@v3

                - name: Install Android SDK packages
                  shell: bash
                  run: |
                    yes | sdkmanager --licenses >/dev/null || true
                    sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "system-images;android-35;google_apis;x86_64" "emulator"

                - name: Set up Gradle cache
                  uses: gradle/actions/setup-gradle@v6

                - name: Validate Gradle Wrapper
                  shell: bash
                  run: |
                    set -euo pipefail
                    test -s gradlew
                    test -s gradlew.bat
                    test -s gradle/wrapper/gradle-wrapper.jar
                    test -s gradle/wrapper/gradle-wrapper.properties
                    grep -q 'gradle-9.3.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
                    chmod +x gradlew

                - name: Run unit tests
                  run: ./gradlew --no-daemon test --stacktrace

                - name: Build debug APK
                  run: ./gradlew assembleDebug

                - name: Build release APK
                  run: ./gradlew assembleRelease

                - name: Build release AAB
                  run: ./gradlew bundleRelease

                - name: Run instrumented tests API 35
                  uses: reactivecircus/android-emulator-runner@v2
                  with:
                    api-level: 35
                    arch: x86_64
                    target: google_apis
                    disable-animations: true
                    script: ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace

                - name: Verify Android build outputs
                  shell: bash
                  run: |
                    set -euo pipefail
                    DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -size +0c | head -n 1)"
                    RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -size +0c | head -n 1)"
                    RELEASE_AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -size +0c | head -n 1)"
                    test -n "$DEBUG_APK"
                    test -n "$RELEASE_APK"
                    test -n "$RELEASE_AAB"
                    stat -c '%n %s bytes' "$DEBUG_APK" "$RELEASE_APK" "$RELEASE_AAB"

                - name: Upload Android release artifacts
                  uses: actions/upload-artifact@v6
                  with:
                    name: basket-manager-release-artifacts
                    if-no-files-found: error
                    path: |
                      app/build/outputs/apk/debug/*.apk
                      app/build/outputs/apk/release/*.apk
                      app/build/outputs/bundle/release/*.aab

                - name: Upload test reports
                  if: always()
                  uses: actions/upload-artifact@v6
                  with:
                    name: basket-manager-test-reports
                    if-no-files-found: ignore
                    path: |
                      app/build/reports/tests/**
                      app/build/reports/androidTests/**
          '''
          build_workflow = '\n'.join(line[10:] if line.startswith('          ') else line for line in build_workflow.splitlines()) + '\n'
          Path('.github/workflows/android-build.yml').write_text(build_workflow)

          lint_workflow = '''name: Android Lint

          on:
            push:
              branches:
                - main
                - master
                - fix/android-build-validation
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            lint:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v6

                - name: Set up JDK 17
                  uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: '17'

                - name: Set up Android SDK
                  uses: android-actions/setup-android@v3

                - name: Set up Gradle cache
                  uses: gradle/actions/setup-gradle@v6

                - name: Validate Gradle Wrapper
                  shell: bash
                  run: |
                    set -euo pipefail
                    test -s gradlew
                    test -s gradlew.bat
                    test -s gradle/wrapper/gradle-wrapper.jar
                    test -s gradle/wrapper/gradle-wrapper.properties
                    grep -q 'gradle-9.3.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
                    chmod +x gradlew

                - name: Run Android lint
                  run: ./gradlew --no-daemon lint --stacktrace
          '''
          lint_workflow = '\n'.join(line[10:] if line.startswith('          ') else line for line in lint_workflow.splitlines()) + '\n'
          Path('.github/workflows/android-lint.yml').write_text(lint_workflow)

          Path('.github/workflows/bootstrap-wrapper-once.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Android build validation and Gradle wrapper'
          git push origin HEAD:fix/android-build-validation
