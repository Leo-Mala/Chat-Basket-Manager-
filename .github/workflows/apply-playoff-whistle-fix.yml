name: Apply playoff completion whistle fix

on:
  push:
    branches:
      - feature/season-complete-whistle

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/season-complete-whistle
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Disable normal playoff game sounds
        run: |
          python -c "from pathlib import Path; p=Path('app/src/main/java/com/example/GameViewModel.kt'); s=p.read_text(); old='val result = currentSeason.simulatePlayoffs(context.applicationContext, simulationConfig())'; new='val result = currentSeason.simulatePlayoffs(context.applicationContext, simulationConfig(effectsEnabled = false))'; assert s.count(old) == 1, 'playoff simulation call not found exactly once'; p.write_text(s.replace(old, new))"
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-playoff-whistle-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/GameViewModel.kt .github/workflows/apply-playoff-whistle-fix.yml
          git commit -m "Use completion whistle after NBA Finals"
          git push origin HEAD:feature/season-complete-whistle
